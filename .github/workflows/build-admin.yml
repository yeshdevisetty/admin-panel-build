# Admin panel build on a free public-repo runner.
#
# The source is PRIVATE. It is cloned with a read-only deploy key, tested,
# type-checked and built, then destroyed with the runner. Nothing from it is
# committed here or uploaded as an Actions artifact (those are public on a
# public repo). The built `.next` goes to private R2 storage:
#   r2:app-builds/admin-panel/<stage>/<sha>.tar.gz (+ .sha256)
# koha-dev's deploy.py downloads it instead of building on the server.
#
# Only build-time env is provided (NEXT_PUBLIC_*, image hosts, server-actions
# key). Runtime secrets stay on koha-dev in the release .env.

name: Build Admin
run-name: "Build Admin · ${{ inputs.stage }} · ${{ inputs.sha }} · ${{ inputs.correlation || 'manual' }}"

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Target deployment"
        type: choice
        options: [v3, v4]
      sha:
        description: "Exact 40-char commit to build"
        required: true
      correlation:
        description: "Correlation id (set by deploy.py)"
        default: ""

permissions:
  contents: read

concurrency:
  group: admin-${{ inputs.stage }}-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate inputs
        env:
          SHA: ${{ inputs.sha }}
        run: '[[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-char commit"; exit 1; }'

      - name: Check out admin-panel (private, read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ inputs.sha }}
          ssh-key: ${{ secrets.SOURCE_REPO_SSH_KEY }}
          path: src
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        working-directory: src
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci --no-audit --no-fund

      - name: Write build-time env
        working-directory: src
        env:
          STAGE: ${{ inputs.stage }}
          ENV_V3: ${{ secrets.BUILD_ENV_V3 }}
          ENV_V4: ${{ secrets.BUILD_ENV_V4 }}
        run: |
          set -euo pipefail
          if [ "$STAGE" = v3 ]; then printf '%s\n' "$ENV_V3" > .env; else printf '%s\n' "$ENV_V4" > .env; fi
          echo ".env: $(grep -c = .env) keys"

      # Same gates deploy.py ran on the server.
      - name: Auth tests
        working-directory: src
        run: npm test -- --run tests/src/auth
      - name: Typecheck
        working-directory: src
        run: npm run typecheck
      - name: Build
        working-directory: src
        env:
          # CI unset: matches the server build (Sentry source-map upload off).
          CI: ""
          NEXT_TELEMETRY_DISABLED: "1"
          ADMIN_BUILD_NO_CACHE: "1"
        run: npm run build

      - name: Upload .next to private R2
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG_R2 }}
          STAGE: ${{ inputs.stage }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          rm -f src/.env
          name="${SHA}.tar.gz"
          tar -C src --exclude=.next/cache -czf "$RUNNER_TEMP/$name" .next
          ( cd "$RUNNER_TEMP" && sha256sum "$name" > "$name.sha256" && ls -lh "$name" )
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          conf="$RUNNER_TEMP/rclone.conf"; printf '%s' "$RCLONE_CONF" > "$conf"; chmod 600 "$conf"
          dest="r2:app-builds/admin-panel/${STAGE}"
          rclone --config "$conf" copyto "$RUNNER_TEMP/$name" "$dest/$name" --no-traverse
          rclone --config "$conf" copyto "$RUNNER_TEMP/$name.sha256" "$dest/$name.sha256" --no-traverse
          rm -f "$conf"
          echo "### Uploaded admin-panel/${STAGE}/${name}" >> "$GITHUB_STEP_SUMMARY"
